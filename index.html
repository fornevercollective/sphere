      ['BCI workshop', 'https://www.gtec.at/event/bci-workshop-at-sfn-2026/?trk=public_post_comment-text', 'g.tec, SfN 2026. Not run here']
    ]],

      ['FlexGlue', 'https://github.com/cvg/FlexGlue', 'CVG. Not run here'],
      ['SplatThumb', 'https://github.com/VoxelKei/SplatThumb', 'Splats. Not run here'],
      ['PlateToAOVs', 'https://github.com/Mariolepipe/PlateToAOVs', 'AOVs. Not run here'],
      ['RelationVGGT', 'https://relationvggt.github.io', 'Relation VGGT. Not run here'],
      ['ReLift3D', 'https://relift3d.github.io', 'ReLift3D. Not run here'],
      ['Basketball CV', 'https://www.linkedin.com/posts/luis-condados_computervision-sportsanalytics-basketball-ugcPost-7517394361421307904-JSng/', 'Sports vision post. Not run here']
    ]]
  ];

  const params = new URLSearchParams(location.search);
  const cv = document.getElementById('cv');
  const hint = document.getElementById('hint');
  const sheet = document.getElementById('sheet');
  const el = {
    evVal: document.getElementById('ev-val'),
    evPose: document.getElementById('ev-pose'),
    evNext: document.getElementById('ev-next'),
    evNote: document.getElementById('ev-note'),
    blState: document.getElementById('bl-state'),
    blAmp: document.getElementById('bl-amp'),
    blImu: document.getElementById('bl-imu'),
    blBus: document.getElementById('bl-bus'),
    blLog: document.getElementById('bl-log'),
    v1Main: document.getElementById('v1-main'),
    v1Range: document.getElementById('v1-range'),
    v1Ch: document.getElementById('v1-ch'),
    pathMain: document.getElementById('path-main'),
    pathEff: document.getElementById('path-eff'),
    pathSh: document.getElementById('path-sh'),
    pathNote: document.getElementById('path-note'),
    pathWord: document.getElementById('path-word'),
    blQ: document.getElementById('bl-q'),
    codexMet: document.getElementById('codex-met'),
    codexFlow: document.getElementById('codex-flow'),
    flowList: document.getElementById('flow-list')
  };
  const board = document.getElementById('board');
  const wordInput = document.getElementById('word');
  window.addEventListener('error', (e) => { hint.textContent = e.message || 'error'; });

  let setName = params.get('set') || 'event';
  if (setName !== 'bloch' && setName !== 'v1') setName = 'event';
  let menuName = params.get('menu') || (setName === 'bloch' ? 'bloch' : 'sphere');
  if (['sphere', 'bloch', 'path', 'codex', 'cube', 'flow'].indexOf(menuName) < 0) menuName = 'sphere';
  if (!params.get('set') && menuName === 'bloch') setName = 'bloch';
  if (params.get('word')) wordInput.value = params.get('word').slice(0, 64);
  const parts = { rings: true, nose: true, trail: true, shadow: true, horizon: true, l1: true, l2: true, l3: true };
  let t0 = performance.now() - (Number(params.get('t')) || 0) * 1000;
  let paused = params.has('still');
  let held = (Number(params.get('t')) || 0) * 1000;
  let last = performance.now();
  let camYaw = 0;
  let camPitch = 0;
  let drag = null;
  let layerView = null;
  const shell = {
    pitch: 0, yaw: 0, rebPitch: 0, rebYaw: 0,
    dragPitch: 0, dragYaw: 0
  };
  let plateOn = false;
  let nextPlatePaint = 0;

  function syncPlate() {
    plateOn = params.get('plate') === '1';
    document.body.classList.toggle('plate', plateOn);
  }
  let bloch = null;
  let lastPost = 0;
  let posted = null;
  let echo = null;
  let inbound = null;
  let bus = null;
  let ear = null;

  function smooth(u) { return u * u * (3 - 2 * u); }
  function deg(n) { return n * Math.PI / 180; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function d1(rad) { return (rad * 180 / Math.PI).toFixed(1); }
  function noseFrom(pitch, yaw) {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    return [cp * Math.cos(yaw), cp * Math.sin(yaw), sp];
  }
  function spin(n) {
    if (!camYaw) return n;
    const c = Math.cos(camYaw), s = Math.sin(camYaw);
    return [n[0] * c - n[1] * s, n[0] * s + n[1] * c, n[2]];
  }
  function pitchShift(p, a) {
    if (!a) return p;
    const c = Math.cos(a), s = Math.sin(a);
    return [p[0] * c - p[2] * s, p[1], p[0] * s + p[2] * c];
  }
  function orbit(p) { return spin(pitchShift(p, camPitch)); }
  function wrapAng(a) {
    const t = Math.PI * 2;
    a = a % t;
    if (a > Math.PI) a -= t;
    if (a < -Math.PI) a += t;
    return a;
  }
  function basisOf(pitch, yaw, roll) {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cr = Math.cos(roll), sr = Math.sin(roll);
    function apply(x, y, z) {
      const y1 = y * cr - z * sr;
      const z1 = y * sr + z * cr;
      const x2 = x * cp + z1 * sp;
      const z2 = x * sp - z1 * cp;
      return [x2 * cy - y1 * sy, x2 * sy + y1 * cy, z2];
    }
    return { x: apply(1, 0, 0), y: apply(0, 1, 0), z: apply(0, 0, 1) };
  }
  function eventRate(sec) {
    const a = eventAt(sec);
    const b = eventAt(sec + 0.08);
    return {
      pitch: clamp((b.pitch - a.pitch) / 0.08, -4, 4),
      yaw: clamp(wrapAng(b.yaw - a.yaw) / 0.08, -4, 4)
    };
  }
  function eventAccel(sec) {
    const a = eventRate(sec);
    const b = eventRate(sec + 0.08);
    return {
      pitch: clamp((b.pitch - a.pitch) / 0.08, -12, 12),
      yaw: clamp((b.yaw - a.yaw) / 0.08, -12, 12)
    };
  }
  // L1 is the requested attitude. L2 lags it: gyro counter is −rate×0.55s, drag is the 0.38s slew.
  // L3 rebound is −accel×0.02s², and the landing blends that with the next recorded key.
  function stepLayers(dt, reqPitch, reqYaw, roll, nextKey) {
    const decay = dt > 0 ? Math.exp(-dt / 0.12) : 0.2;
    shell.dragPitch *= decay;
    shell.dragYaw *= decay;
    let wPitch = shell.dragPitch;
    let wYaw = shell.dragYaw;
    let acc = { pitch: 0, yaw: 0 };
    if (setName === 'event') {
      const r = eventRate(held / 1000);
      wPitch += r.pitch;
      wYaw += r.yaw;
      acc = eventAccel(held / 1000);
    } else if (bloch && bloch.gyro) {
      wPitch += bloch.gyro.wy;
      wYaw += bloch.gyro.wz;
    }
    wPitch = clamp(wPitch, -6, 6);
    wYaw = clamp(wYaw, -6, 6);
    const kickP = clamp(-0.02 * acc.pitch, -0.5, 0.5);
    const kickY = clamp(-0.02 * acc.yaw, -0.5, 0.5);
    const targetPitch = reqPitch - 0.55 * wPitch;
    const targetYaw = reqYaw - 0.55 * wYaw;
    if (!shell.ready) {
      shell.pitch = targetPitch;
      shell.yaw = targetYaw;
      shell.rebPitch = kickP;
      shell.rebYaw = kickY;
      shell.ready = true;
    } else {
      const follow = dt > 0 ? 1 - Math.exp(-dt / 0.38) : 1;
      shell.pitch += (targetPitch - shell.pitch) * follow;
      shell.yaw += wrapAng(targetYaw - shell.yaw) * follow;
      const rebFollow = dt > 0 ? 1 - Math.exp(-dt / 0.45) : 1;
      shell.rebPitch += (kickP - shell.rebPitch) * rebFollow;
      shell.rebYaw += (kickY - shell.rebYaw) * rebFollow;
    }
    let landP = reqPitch + wPitch * 0.4 + shell.rebPitch;
    let landY = reqYaw + wYaw * 0.4 + shell.rebYaw;
    if (nextKey) {
      landP = landP * 0.45 + deg(nextKey.pitch) * 0.55;
      landY = landY * 0.45 + deg(nextKey.yaw) * 0.55;
    }
    const nose = noseFrom(reqPitch, reqYaw);
    const landNose = noseFrom(landP, landY);
    const path = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const d = clamp(dot(nose, landNose), -1, 1);
      const th = Math.acos(d);
      let p;
      if (th < 1e-4) p = nose.slice();
      else {
        const s = Math.sin(th);
        const u = Math.sin((1 - t) * th) / s;
        const v = Math.sin(t * th) / s;
        p = [nose[0] * u + landNose[0] * v, nose[1] * u + landNose[1] * v, nose[2] * u + landNose[2] * v];
      }
      path.push(p);
    }
    const amp = blochOf(nose);
    const lag = Math.hypot(wrapAng(shell.pitch - reqPitch), wrapAng(shell.yaw - reqYaw));
    const reb = Math.hypot(shell.rebPitch, shell.rebYaw);
    layerView = {

    const p = FLOW_POS[ch];
    const keyW = (w - 16) / 11.2;
    const keyH = (h - 20) / 3.6;
    const x = 8 + (p.x) * keyW;
    const y = 8 + p.y * (keyH + 8);
    return { x: x, y: y, keyW: keyW, keyH: keyH };
  }
  function drawKeys(canvas, solved) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const used = {};
    solved.chars.forEach((ch) => { used[ch] = true; });
    const keyW = (w - 16) / 11.2;
    const keyH = (h - 20) / 3.6;
    ctx.font = '500 18px "Avenir Next", "Helvetica Neue", Helvetica, sans-serif';
    ctx.textBaseline = 'middle';
    KEY_ROWS.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        const k = row[c];
        const x = 8 + (c + r * 0.25) * keyW;
        const y = 8 + r * (keyH + 8);
        ctx.strokeStyle = used[k] ? '#f4f4f4' : '#2a2a2a';
        ctx.lineWidth = used[k] ? 1.4 : 1;
        ctx.strokeRect(x, y, keyW * 0.88, keyH);
        ctx.fillStyle = used[k] ? '#f4f4f4' : '#6a6a6a';
        ctx.fillText(k, x + 8, y + keyH * 0.5);
      }
    });
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.6;
    solved.chars.forEach((ch, i) => {
      const p = FLOW_POS[ch];
      if (!p) return;
      const box = keyCenter(ch, w, h);
      const x = box.x + keyW * 0.44;
      const y = box.y + keyH * 0.5;
      if (i) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
    });
    ctx.stroke();
  }
  function wordCubePoint(ch) {
    const p = FLOW_POS[ch];
    if (!p) return null;
    return [(p.x / 10.25) * 1.35 - 0.68, 0.62 - (p.y / 2) * 1.15, 0.62];
  }
  function drawMiniCube(canvas, nose, solved) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const R = Math.min(w, h) * 0.46;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.stroke();
    const s = 0.72;
    const corners = [];
    for (let x = -1; x <= 1; x += 2) {
      for (let y = -1; y <= 1; y += 2) {
        for (let z = -1; z <= 1; z += 2) corners.push(toScreen(x * s, y * s, z * s, R));
      }
    }
    const edges = [[0,1],[0,2],[0,4],[3,1],[3,2],[3,7],[5,1],[5,4],[5,7],[6,2],[6,4],[6,7]];
    ctx.beginPath();
    ctx.lineWidth = 1.05;
    ctx.strokeStyle = 'rgba(230,230,230,0.8)';
    edges.forEach((e) => {
      ctx.moveTo(corners[e[0]].x, -corners[e[0]].y);
      ctx.lineTo(corners[e[1]].x, -corners[e[1]].y);
    });
    ctx.stroke();
    const tip = toScreen(nose[0] * s, nose[1] * s, nose[2] * s, R);
    const origin = toScreen(0, 0, 0, R);
    ctx.beginPath();
    ctx.moveTo(origin.x, -origin.y);
    ctx.lineTo(tip.x, -tip.y);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(tip.x, -tip.y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    if (solved && solved.chars && solved.chars.length > 1) {
      ctx.beginPath();
      ctx.lineWidth = 1.35;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      let started = false;
      solved.chars.forEach((ch) => {
        const p = wordCubePoint(ch);
        if (!p) return;
        const s = toScreen(p[0], p[1], p[2], R);
        if (!started) { ctx.moveTo(s.x, -s.y); started = true; }
        else ctx.lineTo(s.x, -s.y);
      });
      ctx.stroke();
      solved.chars.forEach((ch) => {
        const p = wordCubePoint(ch);
        if (!p) return;
        const s = toScreen(p[0], p[1], p[2], R);
        ctx.beginPath();
        ctx.arc(s.x, -s.y, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = '#f4f4f4';
        ctx.fill();
      });
    }
    ctx.restore();
  }
  function qText(msg) {
    if (!msg || !msg.qubits || !msg.qubits[0]) return '—';
    const q = msg.qubits[0];
    const who = msg.source ? ' ' + msg.source : '';
    return d1(q.theta) + '° ' + d1(q.phi) + '°' + who;
  }
  function paintDock(viewNose, rawTrail) {
    const ev = eventAt(held / 1000);
    const keys = upcoming(ev.t);
    el.evVal.textContent = (ev.mode === 'df' ? 'DOWNFORCE ' : 'G-FORCE ') + fmtVal(ev.mode, ev.v) + ' · ' + ev.t.toFixed(1) + ' s';
    el.evPose.textContent = 'pitch ' + d1(ev.pitch) + '° · yaw ' + d1(ev.yaw) + '° · roll ' + d1(ev.roll) + '°';
    el.evNext.textContent = keys.map((k) => {
      const wrap = k.t <= ev.t + 0.04;

    }).join(' · ');
    el.evNote.textContent = setName === 'event'
      ? 'Next recorded keys. The ring is that next nose.'

    if (!bloch) {

    } else {
      const g = bloch.gyro;
      el.blState.textContent = 'θ ' + d1(bloch.theta) + '° · φ ' + d1(bloch.phi) + '° · |r| ' + Math.hypot(bloch.rx, bloch.ry, bloch.rz).toFixed(2)
        + ' · residual ' + (bloch.residual * 180 / Math.PI).toFixed(2) + '°';
      el.blAmp.textContent = 'p0 ' + bloch.p0.toFixed(3) + ' · p1 ' + bloch.p1.toFixed(3)
        + ' · α ' + bloch.alpha.toFixed(3)
        + ' · β ' + bloch.betaRe.toFixed(3) + (bloch.betaIm >= 0 ? ' + ' : ' − ') + Math.abs(bloch.betaIm).toFixed(3) + ' i'
        + ' · ' + Math.round(bloch.downforce) + ' kg · alt ' + bloch.alt.toFixed(1) + ' ft';
      el.blImu.textContent = 'gyro ' + (g ? g.wx.toFixed(3) + '  ' + g.wy.toFixed(3) + '  ' + g.wz.toFixed(3) : '—')
        + ' · anchor ' + d1(bloch.anchorAng) + '°'
        + ' · chord ' + ((bloch.noseRate || 0) * 0.5).toFixed(3);
      const q = bloch.q || [];
      el.blQ.textContent = q.length === 4
        ? ('q ' + q[0].toFixed(3) + '  ' + q[1].toFixed(3) + '  ' + q[2].toFixed(3) + '  ' + q[3].toFixed(3)
          + ' · r ' + bloch.rx.toFixed(2) + '  ' + bloch.ry.toFixed(2) + '  ' + bloch.rz.toFixed(2))
        : '';
      const log = bloch.log && bloch.log[0];
      el.blLog.textContent = 'N ' + bloch.posN.toFixed(1) + ' E ' + bloch.posE.toFixed(1)
        + (log ? (' · log ' + log.t.toFixed(1) + 's · pitch ' + log.pitch.toFixed(1) + '° · θ ' + log.theta.toFixed(1) + '° · ' + Math.round(log.df) + ' kg · ' + log.alt.toFixed(1) + ' ft') : '');
    }
    el.blBus.textContent = 'posted ' + qText(posted) + ' · heard ' + qText(echo)
      + (inbound ? ' · in ' + (inbound.source || 'foreign') + ' ' + qText(inbound) : '');
    drawSparks(document.getElementById('bl-spark'));

    const v1n = noseFrom(deg(V1.pitch), 0);
    const range = Math.acos(clamp(dot(viewNose, v1n), -1, 1));
    el.v1Main.textContent = 'pitch ' + V1.pitch + '° · roll ' + V1.roll + '° · ' + V1.downforceKg + ' kg · ' + V1.altitudeFt + ' ft';
    el.v1Range.textContent = 'range to v1 nose ' + d1(range) + '°';

    el.pathEff.textContent = 'efficiency ' + m.efficiency.toFixed(1) + ' · strain ' + m.strain.toFixed(1);
    el.pathSh.textContent = 'equator shadow ' + Math.hypot(viewNose[0], viewNose[1]).toFixed(2);
    el.pathNote.textContent = layerView

  function paintCodex(viewNose) {

  function publish(nose) {
    const now = performance.now();
    if (now - lastPost < 100 && posted) return;
    lastPost = now;
    const b = blochOf(nose);
    posted = {
      type: 'bloch-state',
      source: 'roadster-bloch',
      qubits: [{ theta: b.theta, phi: b.phi, label: 'q0' }],
      dual: { particle: { theta: b.theta, phi: b.phi, rx: nose[0], ry: nose[1], rz: nose[2] } },
      timestamp: Date.now()
    };
    try { if (bus) bus.postMessage(posted); } catch (e) { /* channel closed */ }
  }

  function bandHeight() {
    const raw = getComputedStyle(document.documentElement).getPropertyValue('--plate');
    const n = parseFloat(raw);
    return n > 40 ? n : 168;
  }
  function drawStage(ctx, y, w, h, pose, viewNose, viewTrail, nextNose, wordPts) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y, w, h);
    ctx.clip();
    let R = Math.min(w * 0.34, h * 0.36);
    if (R * 4.85 > w * 0.96) R = (w * 0.96) / 4.85;
    const gap = R * 0.85;
    const gx = w / 2 - gap / 2 - R;
    const sx = w / 2 + gap / 2 + R;
    const cy = y + h * 0.50;
    const max = pose.mode === 'df' ? 5000 : 3;
    drawArc(ctx, gx, cy, R, pose.v / max);
    ctx.fillStyle = '#f5f5f5';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const font = '"Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.font = '500 ' + Math.round(R * 0.105) + 'px ' + font;
    ctx.fillText(pose.mode === 'df' ? 'DOWNFORCE' : 'G-FORCE', gx, cy - R * 0.26);
    ctx.font = '300 ' + Math.round(R * 0.44) + 'px ' + font;
    ctx.fillText(pose.mode === 'df' ? String(Math.round(pose.v)) : pose.v.toFixed(1), gx, cy + R * 0.05);
    ctx.font = '400 ' + Math.round(R * 0.095) + 'px ' + font;
    ctx.fillStyle = '#cfcfcf';
    ctx.fillText(pose.mode === 'df' ? 'KG' : 'G', gx, cy + R * 0.30);
    drawSphere(ctx, sx, cy, R, viewNose, viewTrail, nextNose, wordPts);
    ctx.restore();
  }
  function drawPlate(ctx, y, w, h, pose, viewNose, viewTrail, wordPts) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y, w, h);
    ctx.clip();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, y, w, h);
    ctx.strokeStyle = '#242424';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(w, y + 0.5);
    ctx.stroke();
    const R = Math.max(34, Math.min(h * 0.36, 72));
    const sx = Math.round(14 + R);
    const cy = Math.round(y + h * 0.54);
    drawSphere(ctx, sx, cy, R, viewNose, viewTrail, null, wordPts);
    const font = '"Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif';
    const x = sx + R + 20;
    const rows = [
      ['PITCH', ((pose.pitch + camPitch) * 180 / Math.PI).toFixed(1) + '°'],
      ['YAW', ((pose.yaw + camYaw) * 180 / Math.PI).toFixed(1) + '°'],
      ['ROLL', (pose.roll * 180 / Math.PI).toFixed(1) + '°']
    ];
    if (pose.alt != null) rows.push(['ALT', pose.alt.toFixed(1) + ' ft']);
    rows.push([pose.mode === 'df' ? 'FORCE' : 'G', pose.mode === 'df' ? Math.round(pose.v) + ' kg' : pose.v.toFixed(1) + ' g']);
    const lv = layerView;
    const nxt = upcoming(held / 1000)[0];
    const nextText = nxt ? (nxt.t + 's ' + (nxt.mode === 'df' ? Math.round(nxt.v) : nxt.v.toFixed(1))) : '—';
    const cast = lv ? [
      ['θ', (lv.theta * 180 / Math.PI).toFixed(1) + '°'],
      ['φ', (lv.phi * 180 / Math.PI).toFixed(1) + '°'],
      ['RESID', bloch ? ((bloch.residual * 180 / Math.PI).toFixed(2) + '°') : '—'],
      ['NEXT', nextText],
      ['L2', lv.lagDeg + '°'],
      ['L3', lv.rebDeg + '°'],
      ['LAND', lv.landDeg + '°']
    ] : [];
    const more = lv ? [
      ['SHADOW', lv.shadow.toFixed(2)],
      ['RANGE', (lv.range * 180 / Math.PI).toFixed(1) + '°'],
      ['P0', lv.p0.toFixed(3)],
      ['P1', lv.p1.toFixed(3)],
      ['RATE', (lv.wPitch * 180 / Math.PI).toFixed(0) + ' ' + (lv.wYaw * 180 / Math.PI).toFixed(0)]
    ] : [];
    if (lv && bloch && bloch.gyro) {
      more.push(['GYRO', bloch.gyro.wx.toFixed(2) + ' ' + bloch.gyro.wy.toFixed(2) + ' ' + bloch.gyro.wz.toFixed(2)]);
    }
    if (bloch && bloch.q && bloch.q.length === 4) {
      more.push(['Q', bloch.q.map((v) => v.toFixed(2)).join(' ')]);
    }
    const groups = [{ head: pose.source === 'bloch' ? 'BLOCH' : pose.source === 'v1' ? 'V1' : 'EVENT', rows: rows, valueAt: 72, valueSize: 15, span: 156 }];
    if (cast.length) groups.push({ head: 'CAST', rows: cast, valueAt: 52, valueSize: 13, span: 148 });
    if (more.length) groups.push({ head: 'MODEL', rows: more, valueAt: 58, valueSize: 13, span: 168 });
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    let cursor = x;
    groups.forEach((g) => {
      if (cursor + 96 > w) return;
      const rowH = Math.min(22, (h - 28) / g.rows.length);
      let yy = cy - ((g.rows.length - 1) * rowH) / 2;
      ctx.font = '500 10px ' + font;
      ctx.fillStyle = '#8d8d8d';
      ctx.fillText(g.head, cursor, yy - rowH);
      g.rows.forEach((row) => {
        ctx.fillStyle = '#7d7d7d';
        ctx.font = '500 10px ' + font;
        ctx.fillText(row[0], cursor, yy);
        ctx.fillStyle = '#f4f4f4';
        ctx.font = '300 ' + g.valueSize + 'px ' + font;
        ctx.fillText(row[1], cursor + g.valueAt, yy);
        yy += rowH;
      });
      cursor += g.span;
    });
    ctx.restore();
  }

  function frame(now) {
    syncPlate();
    if (plateOn && now < nextPlatePaint) {
      requestAnimationFrame(frame);
      return;
    }
    if (plateOn) nextPlatePaint = now + 33;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!paused) {
      held = now - t0;
      ensureBloch();
      if (bloch) window.RoadsterBloch.step(bloch, dt || 1 / 60);
    }
    const pose = sample();
    const reqPitch = pose.pitch + camPitch;
    const reqYaw = pose.yaw + camYaw;
    const keysNow = upcoming(pose.t);
    const nextKey = setName === 'event' && keysNow.length ? keysNow[0] : null;
    stepLayers(dt, reqPitch, reqYaw, pose.roll, nextKey);
    const viewNose = noseFrom(reqPitch, reqYaw);
    const rawTrail = shownTrail();
    const viewTrail = rawTrail.map(orbit);
    const nextNose = nextKey ? orbit(noseFrom(deg(nextKey.pitch), deg(nextKey.yaw))) : null;
    wordSolve = solveWord(wordInput.value);
    const showWord = !plateOn && board.classList.contains('open') && wordSolve.pts.length > 1;
    const viewWord = showWord ? wordSolve.pts.map(orbit) : null;

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, cv.clientWidth), h = Math.max(1, cv.clientHeight);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    const dockH = plateOn ? 0 : document.getElementById('dock').getBoundingClientRect().height;
    const barH = plateOn ? 0 : Math.ceil(document.getElementById('bar').getBoundingClientRect().height);
    const boardOpen = !plateOn && board.classList.contains('open');
    const boardW = boardOpen ? Math.ceil(board.getBoundingClientRect().right) + 8 : 0;
    hint.style.left = boardW ? (boardW + 8) + 'px' : '16px';
    const plateH = Math.min(bandHeight(), Math.max(120, h - dockH - barH - 40));
    const plateY = h - dockH - plateH;
    ctx.save();
    ctx.translate(boardW, 0);
    drawStage(ctx, barH, Math.max(240, w - boardW), Math.max(40, plateY - barH), pose, viewNose, viewTrail, nextNose, viewWord);
    ctx.restore();
    drawPlate(ctx, plateY, w, plateH, pose, viewNose, viewTrail, viewWord);
    if (!plateOn) paintDock(viewNose, rawTrail);
    publish(viewNose);
    requestAnimationFrame(frame);
  }

  function mark() {
    document.querySelectorAll('[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === setName));
    document.querySelectorAll('[data-menu]').forEach((b) => b.classList.toggle('on', b.dataset.menu === menuName));
    const name = setName === 'event' ? 'event pass' : setName === 'bloch' ? 'bloch estimator' : 'v1 still';
    hint.textContent = name + ' is L1 · L2 counters · L3 lands · ' + (paused ? 'paused · space runs' : 'drag rotates · space pauses');
  }
  function openBoard(name) {
    const open = name === 'codex' || name === 'cube' || name === 'flow';
    board.classList.toggle('open', open);
    if (!open) return;
    const id = name === 'cube' ? 'codex-cube' : name === 'flow' ? 'flow-head' : 'word';

    if (node && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
  }
  document.getElementById('bar').addEventListener('click', (e) => {

      if (menuName === 'sphere') {
        setName = 'event';

        setName = 'bloch';

        parts.trail = true;
        const trailBtn = document.querySelector('[data-part="trail"]');
        if (trailBtn) trailBtn.classList.add('on');
      }
      openBoard(menuName);
    }
    if (b.dataset.set) {

        ensureBloch();
        if (menuName === 'sphere') menuName = 'bloch';
      }
      if (setName === 'event') t0 = performance.now() - held;
      if (setName !== 'bloch' && menuName === 'bloch') menuName = 'sphere';
    }
    if (b.dataset.part) {

      b.classList.toggle('on', parts[b.dataset.part]);
    }

  document.getElementById('sources').addEventListener('click', () => sheet.classList.toggle('open'));

  sheet.innerHTML = '<p class="lead">The dock computes the slices that read this sample. FlexGlue, splats, Unitree, EMG, BCI, and the MPC playground stay on their own pages.</p>'
    + SOURCES.map((group) => {
      const items = group[1].map((row) => {
        return '<li><a href="' + row[1] + '">' + row[0] + '</a> — ' + row[2] + '</li>';
      }).join('');

    }).join('');

  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.target.tagName === 'INPUT') return;

  cv.addEventListener('pointerdown', (e) => {

    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max(0.016, (now - drag.t) / 1000);
    const ny = drag.yaw + (e.clientX - drag.x) * 0.005;
    const np = clamp(drag.pitch + (drag.y - e.clientY) * 0.004, -1.1, 1.1);
    shell.dragYaw = clamp((ny - camYaw) / dt, -8, 8);
    shell.dragPitch = clamp((np - camPitch) / dt, -8, 8);
    camYaw = ny;
    camPitch = np;
    drag.t = now;
    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.yaw = camYaw;
    drag.pitch = camPitch;
  });
  cv.addEventListener('pointerup', () => { drag = null; });

  try {
    bus = new BroadcastChannel('bloch-state');
    ear = new BroadcastChannel('bloch-state');
    ear.onmessage = (ev) => {
      const m = ev.data;
      if (!m || m.type !== 'bloch-state') return;
      if (m.source === 'roadster-bloch') echo = m;
      else inbound = m;
    };
  } catch (e) { /* file pages can refuse the channel */ }

  ensureBloch();
  const bt = Number(params.get('bt')) || 0;
  if (bt > 0 && bloch) {
    const n = Math.min(3600, Math.round(bt * 60));
    for (let i = 0; i < n; i++) window.RoadsterBloch.step(bloch, 1 / 60);
  }
  if (params.has('sources')) sheet.classList.add('open');
  if (menuName === 'path') parts.trail = true;
  openBoard(menuName);
  syncPlate();
  el.v1Ch.textContent = V1_CHANNELS;
  mark();
  frame(performance.now());
})();
</script>
</body>
</html>
