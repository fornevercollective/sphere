<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sphere — attitude</title>
<style>
  :root { --dock: 228px; --plate: 168px; --drawer: min(400px, 92vw); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #eee;
    font: 13px/1.35 "Avenir Next", "Helvetica Neue", Helvetica, sans-serif; }
  canvas#cv { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar {
    position: fixed; z-index: 3; top: 0; left: 0; right: 0;
    display: flex; flex-wrap: nowrap; gap: 0; align-items: center;
    padding: 0 52px 0 12px;
    background: #000;
    border-bottom: 1px solid #161616;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }
  #bar .brand {
    color: #f5f5f5; letter-spacing: 0.2em; font-size: 11px; font-weight: 500;
    margin-right: 8px; flex: 0 0 auto;
  }
  #bar button {
    flex: 0 0 auto; min-height: 44px; padding: 0 14px;
  }
  button {
    background: transparent; color: #8d8d8d; border: 0; font: inherit;
    letter-spacing: 0.04em; cursor: pointer; padding: 3px 6px;
    touch-action: manipulation;
  }
  button.on { color: #f5f5f5; }
  #edge {
    position: fixed; z-index: 6; top: 50%; right: 0;
    transform: translateY(-50%);
    display: flex; flex-direction: column;
    max-height: min(92vh, 740px); max-height: min(92dvh, 740px);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    overscroll-behavior: contain;
    transition: right .22s cubic-bezier(.2, .9, .2, 1);
  }
  body.sources-open #edge { right: var(--drawer); }
  #edge button {
    box-sizing: border-box;
    writing-mode: vertical-rl; text-orientation: mixed;
    width: 44px; min-height: 44px; padding: 12px 4px;
    border: 1px solid #2a2a2a; border-right: 0;
    background: #000; color: #cfcfcf;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #edge button + button { border-top: 0; }
  #edge button:first-child { border-radius: 10px 0 0 0; }
  #edge button:last-child { border-radius: 0 0 0 10px; }
  #edge button.on { color: #fff; background: #141414; }
  #scrim {
    position: fixed; inset: 0; z-index: 4;
    background: rgba(255, 255, 255, 0.06);
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease;
  }
  body.sources-open #scrim { opacity: 1; pointer-events: auto; }
  #hint {
    position: fixed; left: 16px; bottom: calc(var(--dock) + var(--plate) + 6px); z-index: 3;
    color: #4a4a4a; font-size: 11px; letter-spacing: 0.08em;
  }
  #dock {
    position: fixed; z-index: 3; left: 0; right: 44px; bottom: 0; height: var(--dock);
    display: grid; grid-template-columns: 1.15fr 1.4fr 0.95fr 1.05fr; gap: 16px;
    box-sizing: border-box; padding: 10px 16px 12px;
    background: #000; border-top: 1px solid #242424; pointer-events: none;
  }
  body.sources-open #dock { right: calc(var(--drawer) + 44px); }
  #dock section { min-width: 0; overflow: hidden; }
  #dock h2 {
    margin: 0 0 4px; font-size: 10px; font-weight: 500;
    letter-spacing: 0.16em; color: #6e6e6e;
  }
  #dock p { margin: 0 0 3px; color: #dedede; font-size: 12px; font-weight: 300; }
  #dock .dim { color: #8a8a8a; }
  #dock .split { display: flex; gap: 8px; align-items: flex-start; }
  #dock .split div { min-width: 0; }
  #ev-wave { width: 100%; height: 58px; display: block; margin-top: 4px; }
  #bl-spark { width: 100%; height: 42px; display: block; margin-top: 4px; }
  #cube-cv { width: 112px; height: 112px; flex: none; }
  #sheet {
    position: fixed; z-index: 5; top: 0; right: 0; bottom: 0;
    width: var(--drawer);
    display: flex; flex-direction: column;
    background: #000; border-left: 1px solid #2a2a2a;
    transform: translate3d(100%, 0, 0);
    transition: transform .22s cubic-bezier(.2, .9, .2, 1);
    pointer-events: none;
  }
  #sheet.open { transform: translate3d(0, 0, 0); pointer-events: auto; }
  #sheet .drw-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 8px 16px; flex: 0 0 auto;
    border-bottom: 1px solid #1c1c1c;
  }
  #sheet .drw-hd .ttl {
    font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #f4f4f4;
  }
  #sheet .drw-hd button {
    box-sizing: border-box;
    width: 44px; height: 44px; padding: 0; border-radius: 22px;
    background: #141414; color: #f4f4f4; font-size: 20px;
  }
  #sheet .drw-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    overscroll-behavior: contain;
    padding: 8px 12px 32px;
  }
  #sheet button.row.on { color: #fff; background: #141414; }
  #sheet h2 { font-weight: 500; font-size: 11px; letter-spacing: 0.16em; color: #777; margin: 18px 0 6px; }
  #sheet a, #sheet button.row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px;
    min-height: 44px;
    padding: 8px 10px; box-sizing: border-box; width: 100%;
    text-align: left; color: #e8e8e8; text-decoration: none;
    border-bottom: 1px solid #161616;
  }
  #sheet a span, #sheet button.row span {
    color: #8a8a8a; font-size: 12px; margin-left: 0;
    flex: 1 1 12em; min-width: 0; line-height: 1.35;
  }
  #sheet .lead { color: #9a9a9a; margin: 10px 0 0; }
  #tether-read { color: #cfcfcf; white-space: pre-wrap; font-size: 12px; }
  #track-cam {
    position: fixed; left: 0; top: 0; width: 2px; height: 2px;
    opacity: 0; pointer-events: none;
  }
  #board {
    position: fixed; z-index: 4; display: none;
    top: 46px; left: 12px; width: min(420px, 46vw);
    bottom: calc(var(--dock) + var(--plate) + 12px);
    overflow: auto; background: #070707; border: 1px solid #2a2a2a;
    padding: 8px 14px 18px; box-sizing: border-box;
  }
  #board.open { display: block; }
  #board h2 { font-weight: 500; font-size: 11px; letter-spacing: 0.16em; color: #777; margin: 16px 0 6px; }
  #board p { margin: 0 0 8px; color: #dedede; }
  #board .dim { color: #8a8a8a; }
  #board input {
    width: 100%; box-sizing: border-box; margin: 0 0 8px;
    background: #000; color: #f4f4f4; border: 1px solid #2a2a2a;
    font: inherit; letter-spacing: 0.08em; padding: 8px 10px;
  }
  #board .flow { letter-spacing: 0.12em; color: #f4f4f4; }
  #flow-list { white-space: pre-wrap; color: #cfcfcf; }
  #kb { width: 100%; height: auto; display: block; background: #000; margin: 0 0 8px; }
  #board .row { display: flex; gap: 10px; align-items: flex-start; }
  #codex-cube { width: 148px; height: auto; flex: none; background: #000; }
  #flow-list { font-size: 12px; line-height: 1.45; }
  @media (max-width: 980px) {
    :root { --dock: 46vh; --plate: 148px; }
    #dock { grid-template-columns: 1fr 1fr; height: var(--dock); overflow: auto; }
  }
  body.plate { --dock: 0px; }
  body.plate #bar,
  body.plate #hint,
  body.plate #dock,
  body.plate #sheet,
  body.plate #edge,
  body.plate #scrim,
  body.plate #board { display: none !important; }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">SPHERE</span>
  <button type="button" data-menu="live">Live</button>
  <button type="button" data-menu="sphere" class="on">Sphere</button>
  <button type="button" data-menu="bloch">Bloch</button>
  <button type="button" data-menu="path">Path</button>
  <button type="button" data-menu="codex">Codex</button>
  <button type="button" data-menu="cube">Cube</button>
  <button type="button" data-menu="flow">Flow</button>
  <button type="button" data-menu="rays">Rays</button>
  <button type="button" data-menu="track">Track</button>
  <button type="button" data-menu="map">Map</button>
  <button type="button" data-action="tether">Tether</button>
  <button type="button" data-action="sources" id="sources">Sources</button>
</div>
<nav id="edge" aria-label="Menu">
  <button type="button" data-menu="live">Live</button>
  <button type="button" data-menu="sphere" class="on">Sphere</button>
  <button type="button" data-menu="bloch">Bloch</button>
  <button type="button" data-menu="path">Path</button>
  <button type="button" data-menu="codex">Codex</button>
  <button type="button" data-menu="cube">Cube</button>
  <button type="button" data-menu="flow">Flow</button>
  <button type="button" data-menu="rays">Rays</button>
  <button type="button" data-menu="track">Track</button>
  <button type="button" data-menu="map">Map</button>
  <button type="button" data-action="tether">Tether</button>
  <button type="button" data-action="sources">Sources</button>
</nav>
<div id="scrim"></div>
<aside id="sheet" aria-label="Sources">
  <div class="drw-hd">
    <span class="ttl">SOURCES</span>
    <button type="button" id="src-close" aria-label="Close">×</button>
  </div>
  <div class="drw-body" id="sheet-body"></div>
</aside>
<canvas id="cv"></canvas>
<video id="track-cam" playsinline muted></video>
<div id="hint">event pass drives the gauge · space pauses</div>
<footer id="dock">
  <section>
    <h2>EVENT PASS</h2>
    <p id="ev-val"></p>
    <p id="ev-pose"></p>
    <p id="ev-next"></p>
    <p id="ev-note" class="dim"></p>
    <canvas id="ev-wave" width="360" height="72"></canvas>
  </section>
  <section>
    <h2>BLOCH RETURN</h2>
    <p id="bl-state"></p>
    <p id="bl-amp"></p>
    <p id="bl-imu"></p>
    <p id="bl-q"></p>
    <p id="bl-bus"></p>
    <p id="bl-log" class="dim"></p>
    <canvas id="bl-spark" width="360" height="64"></canvas>
  </section>
  <section>
    <h2>V1 SENSORS</h2>
    <p id="v1-main"></p>
    <p id="v1-range"></p>
    <p id="v1-ch" class="dim"></p>
  </section>
  <section>
    <h2>PATH · NOSE CUBE</h2>
    <div class="split">
      <div>
        <p id="path-main"></p>
        <p id="path-eff"></p>
        <p id="path-sh"></p>
        <p id="path-note" class="dim"></p>
        <p id="path-word"></p>
        <p id="path-sync" class="dim"></p>
      </div>
      <canvas id="cube-cv" width="160" height="160"></canvas>
    </div>
  </section>
</footer>
<aside id="board">
  <h2>CODEX</h2>
  <p class="dim">One QWERTY. Efficiency is 100 minus average key distance times 22. Zen, KBatch, and the globe stay on their pages.</p>
  <input id="word" type="text" maxlength="64" spellcheck="false" autocomplete="off" value="sphere" aria-label="Word">
  <p id="codex-met"></p>
  <p id="codex-flow" class="flow"></p>
  <canvas id="kb" width="720" height="188"></canvas>
  <div class="row">
    <canvas id="codex-cube" width="320" height="280"></canvas>
    <div>
      <h2 id="flow-head">FLOW</h2>
      <p id="flow-list"></p>
    </div>
  </div>
</aside>
<script src="js/roadster-bloch.js"></script>

      const why = mapView && mapView.chain.refused;
      hint.textContent = why
        ? ('refused · ' + why + (paused ? ' · paused' : ''))
        : ('256 sites on this sphere · ' + (paused ? 'paused · space runs' : 'drag rotates · space pauses'));
    }
    requestAnimationFrame(frame);
  }

  function mark() {
    document.querySelectorAll('[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === setName));
    document.querySelectorAll('[data-menu]').forEach((b) => b.classList.toggle('on', b.dataset.menu === menuName));
    document.querySelectorAll('[data-part]').forEach((b) => b.classList.toggle('on', !!parts[b.dataset.part]));
    const name = setName === 'event' ? 'event pass' : setName === 'bloch' ? 'bloch estimator' : 'v1 still';
    if (menuName === 'track') {
      hint.textContent = 'head steers the orbit · ' + track.status + (paused ? ' · paused' : '');
    } else if (menuName === 'map') {
      const why = mapView && mapView.chain.refused;
      hint.textContent = why
        ? ('refused · ' + why + (paused ? ' · paused' : ''))
        : ('256 sites on this sphere · ' + (paused ? 'paused · space runs' : 'drag rotates · space pauses'));
    } else {
      hint.textContent = name + ' is L1 · L2 counters · L3 lands · ' + (paused ? 'paused · space runs' : 'drag rotates · space pauses');
    }
  }
  function openBoard(name) {
    const open = name === 'codex' || name === 'cube' || name === 'flow';
    board.classList.toggle('open', open);
    if (!open) return;
    const id = name === 'cube' ? 'codex-cube' : name === 'flow' ? 'flow-head' : 'word';
    const node = document.getElementById(id);
    if (node && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
  }
  function setSources(open) {
    sheet.classList.toggle('open', open);
    document.body.classList.toggle('sources-open', open);
  }
  function applyMenu(name) {
    if (name !== 'track') stopTrack();
    menuName = name;
    if (name === 'live') {
      setName = 'event';
      paused = false;
      t0 = performance.now() - held;
    } else if (name === 'sphere') {
      setName = 'event';
      t0 = performance.now() - held;
    } else if (name === 'bloch') {
      setName = 'bloch';
      ensureBloch();
    } else if (name === 'path') {
      parts.trail = true;
    } else if (name === 'rays') {
      parts.nose = true;
      parts.trail = true;
      parts.l1 = true;
      parts.l2 = true;
      parts.l3 = true;
    } else if (name === 'track') {
      startTrack();
    }
    openBoard(name);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
    }
  }
  function drawerRow(attr, label, note) {
    return '<button type="button" class="row" ' + attr + '>' + label + '<span>' + note + '</span></button>';
  }
  function fillDrawer() {
    const body = document.getElementById('sheet-body');
    const menus = [
      ['live', 'Live', 'Event pass running'],
      ['sphere', 'Sphere', 'Gauge and the three layers'],
      ['bloch', 'Bloch', 'Estimator sample'],
      ['path', 'Path', 'Travel trail on'],
      ['codex', 'Codex', 'One QWERTY word'],
      ['cube', 'Cube', 'Nose plus the word path'],
      ['flow', 'Flow', 'Bigram hops'],
      ['rays', 'Rays', 'Force, counter, bend, travel'],
      ['track', 'Track', 'Head and hands from the camera'],
      ['map', 'Map', 'Sites, chain, and detector on this sample']
    ];
    const sets = [
      ['event', 'Event', 'Recording keys'],
      ['bloch', 'Bloch', 'Estimator'],
      ['v1', 'v1', 'Pitch 106° still']
    ];
    const partRows = [
      ['rings', 'Rings', 'World cage'],
      ['nose', 'Nose', 'L1 marker'],
      ['trail', 'Trail', 'Smoothed travel'],
      ['shadow', 'Shadow', 'Equator drop'],
      ['horizon', 'Horizon', 'Next key']
    ];
    const layers = [
      ['l1', 'L1', 'Requested rotation'],
      ['l2', 'L2', 'Counter and drag'],
      ['l3', 'L3', 'Rebound and landing']
    ];
    let html = '<h2>MENU</h2>' + menus.map(function (m) {
      return drawerRow('data-menu="' + m[0] + '"', m[1], m[2]);
    }).join('');
    html += drawerRow('data-action="tether"', 'Tether', 'Coordinate fix');
    html += '<h2>SET</h2>' + sets.map(function (m) {
      return drawerRow('data-set="' + m[0] + '"', m[1], m[2]);
    }).join('');
    html += '<h2>PART</h2>' + partRows.map(function (m) {
      return drawerRow('data-part="' + m[0] + '"', m[1], m[2]);
    }).join('');
    html += '<h2>LAYER</h2>' + layers.map(function (m) {
      return drawerRow('data-part="' + m[0] + '"', m[1], m[2]);
    }).join('');
    html += '<h2 id="tether-sec">TETHER</h2>';
    html += '<p id="tether-read">' + window.SphereTether.url + '</p>';
    html += drawerRow('id="tether-copy"', 'Copy', 'Latest JSON');
    html += '<p class="lead">The dock computes the slices that read this sample. Map is a lattice, a chain, and a detector on that same sample. FlexGlue, splats, Unitree, EMG, BCI, g.Pangolin, g.Pype, and FleXray stay on their own pages.</p>';
    html += SOURCES.map(function (group) {
      const items = group[1].map(function (row) {
        if (row[1].indexOf('ws:') === 0) {
          return drawerRow('data-action="copy-url" data-url="' + row[1] + '"', row[0], row[2]);
        }
        const ext = row[1].indexOf('http') === 0;
        return '<a class="row" href="' + row[1] + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + row[0] + '<span>' + row[2] + '</span></a>';
      }).join('');
      return '<h2>' + group[0] + '</h2>' + items;
    }).join('');
    body.innerHTML = html;
  }
  fillDrawer();

  document.addEventListener('click', (e) => {
    if (e.target.id === 'scrim') {
      setSources(false);
      return;
    }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'src-close') {
      setSources(false);
      return;
    }
    if (b.dataset.action === 'sources') {
      setSources(!sheet.classList.contains('open'));
      return;
    }
    if (b.dataset.action === 'tether') {
      menuName = 'tether';
      openBoard('tether');
      setSources(true);
      const sec = document.getElementById('tether-sec');
      if (sec && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
      mark();
      return;
    }
    if (b.id === 'tether-copy') {
      copyText(JSON.stringify(window.SphereTether.latest || {}, null, 2));
      return;
    }
    if (b.dataset.action === 'copy-url' && b.dataset.url) {
      copyText(b.dataset.url);
      return;
    }
    if (b.dataset.menu) {
      applyMenu(b.dataset.menu);
      mark();
      return;
    }
    if (b.dataset.set) {
      setName = b.dataset.set;
      if (setName === 'bloch') {
        ensureBloch();
        if (menuName === 'sphere' || menuName === 'live') menuName = 'bloch';
      }
      if (setName === 'event') t0 = performance.now() - held;
      if (setName !== 'bloch' && menuName === 'bloch') menuName = 'sphere';
      mark();
      return;
    }
    if (b.dataset.part) {
      parts[b.dataset.part] = !parts[b.dataset.part];
      mark();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Escape') {
      setSources(false);
      return;
    }
    if (e.code !== 'Space') return;
    e.preventDefault();
    paused = !paused;
    if (!paused) t0 = performance.now() - held;
    mark();
  });
  cv.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, yaw: camYaw, pitch: camPitch, t: performance.now() };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max(0.016, (now - drag.t) / 1000);
    const ny = drag.yaw + (e.clientX - drag.x) * 0.005;
    const np = clamp(drag.pitch + (drag.y - e.clientY) * 0.004, -1.1, 1.1);
    shell.dragYaw = clamp((ny - camYaw) / dt, -8, 8);
    shell.dragPitch = clamp((np - camPitch) / dt, -8, 8);
    camYaw = ny;
    camPitch = np;
    drag.t = now;
    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.yaw = camYaw;
    drag.pitch = camPitch;
  });
  cv.addEventListener('pointerup', () => { drag = null; });

  try {
    bus = new BroadcastChannel('bloch-state');
    coordBus = new BroadcastChannel('sphere-coords');
    ear = new BroadcastChannel('bloch-state');
    ear.onmessage = (ev) => {
      const m = ev.data;
      if (!m || m.type !== 'bloch-state') return;
      if (m.source === 'roadster-bloch') echo = m;
      else inbound = m;
    };
  } catch (e) { /* file pages can refuse the channel */ }

  ensureBloch();
  connectTether();
  const bt = Number(params.get('bt')) || 0;
  if (bt > 0 && bloch) {
    const n = Math.min(3600, Math.round(bt * 60));
    for (let i = 0; i < n; i++) window.RoadsterBloch.step(bloch, 1 / 60);
  }
  if (menuName === 'path' || menuName === 'rays') parts.trail = true;
  if (menuName === 'rays') {
    parts.nose = true;
    parts.l1 = true;
    parts.l2 = true;
    parts.l3 = true;
  }
  if (params.has('sources') || menuName === 'tether') setSources(true);
  if (menuName === 'track') {
    track.status = window.isSecureContext
      ? 'tap Track to open the camera'
      : 'camera needs http://127.0.0.1:9741/';
  }
  openBoard(menuName);
  if (menuName === 'tether') {
    const sec = document.getElementById('tether-sec');
    if (sec && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
  }
  syncPlate();
  el.v1Ch.textContent = V1_CHANNELS;
  mark();
  frame(performance.now());
})();
</script>
</body>
</html>
